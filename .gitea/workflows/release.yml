# ── .gitea/workflows/release.yml ─────────────────────────────────────────────
#
# Gitea-native CI (compatible with Gitea >= 1.19, which ships a reproduction
# of the GitHub Marketplace actions: actions/checkout@v4, actions/upload-artifact,
# actions/download-artifact).
#
# Jobs:
#   validate  — runs on push + PR: fmt / clippy / test / publish --dry-run
#   release   — manual trigger: bumps version, tags git, publishes to crates.io
#
# Required Gitea Secrets (Settings → Actions → Secrets):
#   CARGO_REGISTRY_TOKEN    — crates.io API token (NOT a GitHub token)

name: rustdata-release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: write   # allow signed-tag push from Gitea Actions runner

jobs:
  # ── Validate: runs on every push + PR ──────────────────────────────────────

  validate:
    name: validate (fmt + clippy + test + dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history for changelog parsing

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: rust-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-${{ matrix.rust }}-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace --all-features

      - name: cargo publish --dry-run (all members, dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p rustdata-macros        --dry-run
          cargo publish -p rustdata-migrations    --dry-run
          cargo publish -p rustdata-core          --dry-run

  # ── Release: manual dispatch ───────────────────────────────────────────────

  release:
    name: release (bump=b${{ matrix.bump }})
    needs: validate
    if: github.ref == 'refs/heads/master' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bump: [ patch, minor, major ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history for signed tagging

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: rust-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-${{ matrix.rust }}-

      - name: Read current version + bump
        id: version
        run: |
          CURRENT=$$(grep '^version = ' crates/rustdata-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          NEXT=$$(python3 - <<PY "$$CURRENT" "${{ matrix.bump }}"
import sys
major, minor, patch = map(int, sys.argv[1].split("."))
bump = sys.argv[2]
if   bump == "major": major += 1; minor = 0; patch = 0
elif bump == "minor":          minor += 1; patch = 0
elif bump == "patch":                         patch += 1
print(f"{major}.{minor}.{patch}")
PY
)
          echo "current=$$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$$NEXT"      >> "$GITHUB_OUTPUT"
          echo "next_short=v$$NEXT" >> "$GITHUB_OUTPUT"

      - name: Bump version in all member Cargo.toml files
        run: |
          VER="${{ steps.version.outputs.next }}"
          for pkg in rustdata-macros rustdata-migrations rustdata-core; do
            sed -i '' "s/^version = \".*\"/version = \"$$VER\"/" crates/$$pkg/Cargo.toml
            grep '^version = ' crates/$$pkg/Cargo.toml | head -1
          done

      - name: Update CHANGELOG.md
        run: |
          VER="${{ steps.version.outputs.next }}"
          DATE="$$(date +%Y-%m-%d)"
          {
            printf "## [%s] - %s\n\n" "$$VER" "$$DATE"
            printf "### Added\n### Changed\n### Fixed\n\n"
            cat CHANGELOG.md
          } > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit + sign-tag
        run: |
          TAG="${{ steps.version.outputs.next_short }}"
          git add -A
          git commit -m "release: $$TAG" --allow-empty
          git tag -s "$$TAG" -m "Release $$TAG"

      - name: Push commit + signed tag to all remotes
        run: |
          TAG="${{ steps.version.outputs.next_short }}"
          git push origin --follow-tags
          git push rustdata --follow-tags

          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p rustdata-macros
          cargo publish -p rustdata-migrations
          cargo publish -p rustdata-core

      - name: Post to Gitea webhook (optional: mirrors PR/issue)
        # Gitea mirror hook is optional and only needed if this repo
        # mirrors pushes back to Gitea; remove if Gitea is primary.
        run: echo "Skipping Gitea mirror (Gitea is primary origin)."
        if: false
