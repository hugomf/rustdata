# ── .gitea/workflows/release.yml ─────────────────────────────────────────────
#
# Gitea Actions — BACKUP publisher.
# Triggered manually only. Fully standalone — no dependency on GitHub.
#
# Required Gitea Secrets (Settings → Actions → Secrets):
#   CARGO_REGISTRY_TOKEN  — crates.io API token

name: rustdata-release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version to publish (overrides bump)"
        required: false
        type: string

permissions:
  contents: write  # allow tag push

jobs:
  release:
    name: release (bump=${{ github.event.inputs.bump || 'patch' }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-edit (for cargo set-version)
        run: cargo install cargo-edit --locked

      - name: Install Python 3 (for version bump script)
        run: apt-get update -y && apt-get install -y python3

      - name: Compute next version
        id: version
        run: |
          CURRENT="$(grep '^version = ' crates/rustdata-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          VERSION_OVERRIDE="${{ github.event.inputs.version }}"
          if [ -n "$VERSION_OVERRIDE" ]; then
            NEXT="$VERSION_OVERRIDE"
            echo "current=$CURRENT"  >> "$GITHUB_OUTPUT"
            echo "next=$NEXT"        >> "$GITHUB_OUTPUT"
            echo "next_short=v$NEXT" >> "$GITHUB_OUTPUT"
            echo "Version override: forcing $CURRENT -> $NEXT"
          else
            bump="${{ github.event.inputs.bump || 'patch' }}"
            NEXT="$(bash scripts/bump_version.sh "$CURRENT" "$bump")"
            echo "current=$CURRENT"  >> "$GITHUB_OUTPUT"
            echo "next=$NEXT"        >> "$GITHUB_OUTPUT"
            echo "next_short=v$NEXT" >> "$GITHUB_OUTPUT"
            echo "Bumping $CURRENT -> $NEXT (type=$bump)"
          fi

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: cargo publish --dry-run (leaf crate, no workspace deps)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rustdata-macros --dry-run

      - name: Bump workspace version
        run: |
          VER="${{ steps.version.outputs.next }}"
          cargo set-version --workspace "$VER"

      - name: Confirm versions
        run: |
          cargo metadata --format-version=1 --no-deps \
            | python3 -c "import sys,json;\
              print(', '.join(f\"{p['name']}={p['version']}\" \
                for p in json.load(sys.stdin)['packages'] if 'rustdata' in p['name']))"

      - name: Update CHANGELOG.md
        run: |
          TITLE="${{ steps.version.outputs.next_short }}"
          DATE="$(date +%Y-%m-%d)"
          {
            printf "## [%s] - %s\n\n" "$TITLE" "$DATE"
            printf "### Added\n### Changed\n### Fixed\n\n"
            cat CHANGELOG.md
          } > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Configure git identity
        run: |
          git config user.name "gitea-actions"
          git config user.email "gitea-actions@noreply.gitea"

      - name: Commit + create annotated tag
        run: |
          TAG="${{ steps.version.outputs.next_short }}"
          git add -A
          git commit -m "release: $TAG" --allow-empty
          git tag -a "$TAG" -m "Release $TAG"

      - name: Push commit + tag to Gitea origin
        run: |
          TAG="${{ steps.version.outputs.next_short }}"
          git push origin --follow-tags

      - name: cargo publish — rustdata-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rustdata-macros --allow-dirty

      - name: cargo publish — rustdata-migrations
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rustdata-migrations --allow-dirty

      - name: cargo publish — rustdata-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rustdata-core --allow-dirty
