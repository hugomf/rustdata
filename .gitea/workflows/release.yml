# ── .gitea/workflows/release.yml ─────────────────────────────────────────────
#
# Gitea-native CI (compatible with Gitea >= 1.19, which ships a reproduction
# of the GitHub Marketplace actions: actions/checkout@v4, actions/upload-artifact,
# actions/download-artifact).
#
# Jobs:
#   validate  — runs on push + PR: fmt / clippy / test / publish --dry-run
#   release   — manual trigger: bumps version, tags git, publishes to crates.io
#
# Required Gitea Secrets (Settings → Actions → Secrets):
#   CARGO_REGISTRY_TOKEN    — crates.io API token (NOT a GitHub token)

name: rustdata-release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: write   # allow signed-tag push from Gitea Actions runner

jobs:
  # ── Validate: runs on every push + PR ──────────────────────────────────────

  validate:
    name: validate (fmt + clippy + test + dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history for changelog parsing

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: rust-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-${{ matrix.rust }}-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace --all-features

      - name: cargo publish --dry-run (all members, dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p rustdata-macros        --dry-run
          cargo publish -p rustdata-migrations    --dry-run
          cargo publish -p rustdata-core          --dry-run

  # ── Release: manual dispatch ───────────────────────────────────────────────

  release:
    name: release (bump=b${{ matrix.bump }})
    needs: validate
    if: github.ref == 'refs/heads/master' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bump: [ patch, minor, major ]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history for signed tagging

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: rust-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-${{ matrix.rust }}-

      - name: Bump version in all member crates
        id: bump-version
        run: |
          CURRENT="$(grep '^version = ' crates/rustdata-core/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          bump="${{ matrix.bump }}"
          NEXT="$(bash scripts/bump_version.sh "$CURRENT" "$bump")"
          echo "NEXT=$NEXT"  >> "$GITHUB_SUMMARY"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT"      >> "$GITHUB_OUTPUT"
          echo "next_short=v$NEXT" >> "$GITHUB_OUTPUT"


      - name: Set workspace version to $$NEXT
        run: cargo set-version --workspace "${{ steps.bump-version.outputs.next }}"

      - name: Confirm versions
        run: |
          cargo metadata --format-version=1 --no-deps \
            | python3 -c "import sys,json;\
              print(', '.join(f\"{p['name']}={p['version']}\" \
                for p in json.load(sys.stdin)['packages'] if 'rustdata' in p['name']))"


      - name: Update CHANGELOG.md
        run: |
          TITLE="${{ steps.bump-version.outputs.next_short }}"
          DATE="$(date +%Y-%m-%d)"
          {
            printf "## [%s] - %s\n\n" "$TITLE" "$DATE"
            printf "### Added\n### Changed\n### Fixed\n\n"
            cat CHANGELOG.md
          } > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit + sign-tag
        run: |
          TAG="${{ steps.bump-version.outputs.next_short }}"
          git add -A
          git commit -m "release: $TAG" --allow-empty
          git tag -s "$TAG" -m "Release $TAG"

      - name: Push commit + signed tag to all remotes
        run: |
          TAG="${{ steps.bump-version.outputs.next_short }}"
          git push origin --follow-tags
          git push rustdata --follow-tags

      - name: cargo publish — rustdata-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p rustdata-macros
          cargo publish -p rustdata-migrations
          cargo publish -p rustdata-core

  # ═══════════════════════════════════════════════════════════════════════════
  #  Optional step — Gitea mirror hook
  #  If Gitea is primary, keep this step and adjust the URL below.
  #  The step is guarded by `if: false` so it never fires during manual dispatch.
  # ═══════════════════════════════════════════════════════════════════════════

  post-to-gitea:
    name: Post to Gitea mirror hook (optional)
    needs: release
    if: |
      github.repository == 'hugomf/rustdata'   # guard: runs on push only, not dispatch
    runs-on: ubuntu-latest
    steps:
      - name: No-op (Gitea is primary origin; mirror disabled)
        run: echo "Gitea mirror hook not configured. Uncomment and wire URL to enable."

