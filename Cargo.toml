[package]
name = "ff-rustdata"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

[workspace]
members = ["crates/rustdata-core", "crates/rustdata-macros", "crates/rustdata-migrations"]

[workspace.dependencies]
hex = "0.4"
sha2 = "0.11.0"
walkdir = "2"

[dev-dependencies]
# rustdata-macros is NOT listed here: its derive macros are re-exported
# by rustdata-core, so adding it separately is redundant.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "chrono", "uuid"] }
rustdata-core = { path = "crates/rustdata-core", features = ["sqlite"] }
rustdata-migrations = { path = "crates/rustdata-migrations" }
