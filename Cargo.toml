[workspace]
members = ["crates/rustdata-core", "crates/rustdata-macros", "crates/rustdata-migrations", "crates/migration_test"]
resolver = "2"

[workspace.package]
version = "0.1.1"
authors = ["Hugo Mendes <contato@hugomendes.dev>"]
description = "Spring Data-style generic CRUD repository for sqlx with multi-dialect support"
homepage = "https://github.com/hugomf/rustdata"
repository = "https://github.com/hugomf/rustdata"
keywords = ["sqlx", "repository", "crud", "database", "orm"]
categories = ["database", "asynchronous"]
license = "MIT"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
hex = "0.4"
sha2 = "0.10"
walkdir = "2"

