# ── .github/workflows/release.yml ─────────────────────────────────────────────
#
# GitHub Actions — PRIMARY publisher.
# Triggered manually. Pushes to GitHub origin only.
#
# Jobs:
#   validate  — runs on every push + PR: fmt / clippy / test / publish --dry-run
#   release   — manual dispatch (dropdown: patch / minor / major): bumps version,
#               tags, pushes to primary GitHub origin, publishes to crates.io.
#
# Required Secrets:
#   CARGO_REGISTRY_TOKEN  — crates.io API token

name: rustdata-release

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump type"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version to publish (overrides bump)"
        required: false
        type: string

permissions:
  contents: write   # allow tag push

jobs:
  validate:
    name: validate (fmt + clippy + test + dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry / target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-stable-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: cargo publish --dry-run (leaf crate, no workspace deps)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rustdata-macros --dry-run

  release:
    name: release (${{ github.event.inputs.bump || 'patch' }})
    needs: validate
    if: github.event_name == 'workflow_dispatch' && needs.validate.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo-edit (for cargo set-version)
        run: cargo install cargo-edit --locked

      - name: Cache cargo registry / target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-stable-

      - name: Compute next version
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            function bump(current, type) {
              const [major, minor, patch] = current.split('.').map(Number);
              if (type === 'major') return `${major+1}.0.0`;
              if (type === 'minor') return `${major}.${minor+1}.0`;
              return `${major}.${minor}.${patch+1}`;
            }
            const tm = fs.readFileSync(path.join(process.env.GITHUB_WORKSPACE, 'crates', 'rustdata-core', 'Cargo.toml'), 'utf8');
            const m = tm.match(/^version\s*=\s*"([^"]+)"/m);
            if (!m) core.setFailed('Could not read current version');
            const current = m[1];
            const versionOverride = core.getInput('version');
            if (versionOverride) {
              core.setOutput('current', current);
              core.setOutput('next', versionOverride);
              core.setOutput('next_short', 'v' + versionOverride);
              core.info(`Version override: forcing ${current} → ${versionOverride}`);
            } else {
              const bumpType = core.getInput('bump') || 'patch';
              const next = bump(current, bumpType);
              core.setOutput('current', current);
              core.setOutput('next', next);
              core.setOutput('next_short', 'v' + next);
              core.info(`Bumping ${current} → ${next} (type=${bumpType})`);
            }
        inputs:
          bump:
            required: false
            default: patch
          version:
            required: false

      - name: Bump version in all member crates
        run: |
          VER="${{ steps.version.outputs.next }}"
          cargo set-version --workspace "$VER"

      - name: Update CHANGELOG.md
        id: changelog
        run: |
          VER="${{ steps.version.outputs.next }}"
          DATE="$(date +%Y-%m-%d)"
          SECTION="/tmp/new_changelog_section.md"

          printf '## [%s] - %s\n\n### Added\n\n### Changed\n\n### Fixed\n\n' \
            "$VER" "$DATE" > "$SECTION"

          if grep -q '^# CHANGELOG' CHANGELOG.md 2>/dev/null; then
            tmp=$(mktemp)
            pivot=$(grep -n '^# CHANGELOG' CHANGELOG.md | head -1 | cut -d: -f1)
            { head -n "$pivot" CHANGELOG.md; echo ""; cat "$SECTION"; tail -n +$((pivot + 1)) CHANGELOG.md; } > "$tmp"
            mv "$tmp" CHANGELOG.md
          else
            { echo ""; cat "$SECTION"; } >> CHANGELOG.md
          fi
          {
            echo "next_section<<EOF"
            grep -A 5 '^## \['"$VER"']' CHANGELOG.md | head -6
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Show CHANGELOG diff (review before tagging)
        run: |
          git -c color.ui=never diff CHANGELOG.md | sed -n '/^---$/,/^@@/p; /^+## \[/p'

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump + changelog
        run: |
          TAG="${{ steps.version.outputs.next_short }}"
          git commit -am "release: v$TAG" || true

      - name: Create and push version tag (annotated, not signed)
        run: |
          TAG="${{ steps.version.outputs.next_short }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin --follow-tags

      - name: cargo publish — rustdata-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rustdata-macros --allow-dirty

      - name: cargo publish — rustdata-migrations
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rustdata-migrations --allow-dirty

      - name: cargo publish — rustdata-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rustdata-core --allow-dirty

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.next_short }}
          name: ${{ steps.version.outputs.next_short }}
          body: |
            ## What changed

            ${{ steps.changelog.outputs.next_section}}

            See [CHANGELOG.md](https://github.com/hugomf/rustdata/blob/master/CHANGELOG.md) for the full history.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
